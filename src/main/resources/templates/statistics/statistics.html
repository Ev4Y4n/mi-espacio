<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mi Espacio</title>

<!-- Tabler (el que realmente usan tus clases: navbar-vertical, row-cards, card-body...) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/base-colors.css}" />
<link rel="stylesheet" th:href="@{/css/dashboard.css}" />

</head>
 
<body>
<div class="page">
	<div th:replace="~{dashboard/nav-bar.html :: nav_bar}"></div>
	<!-- Contenido -->
	<div class="page-wrapper">
		<!-- Banner -->
		<div class="position-relative w-100"
		     th:style="|background: url('@{/img/mi-espacio-fondo.png}') center bottom / cover no-repeat; height: 12rem; image-rendering: pixelated;|">
			<div class="position-absolute top-0 end-0 m-3" style="z-index: 2;">
				<div th:replace="~{profile-dropdown :: profile_dropdown}"></div>
			</div>
		</div>
		<main class="page-body" >
			<div class="container-xl">
			<h1>ESTADISTICAS</h1>
			</div>
		</main>
	</div>
</div>
</body>

</html>
