<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
	<div class="card" th:fragment="month-progress-card">
		<div class="card-header">
			<h3 class="card-title">Tu progreso este mes</h3>
			<a th:href="@{/statistics}" class="ms-auto">Ver estadísticas</a>
		</div>
		<div class="card-body">
			<div class="mb-3">
				<div class="d-flex justify-content-between"><span>Libros</span><span>75%</span></div>
				<div class="progress"><div class="progress-bar" style="width: 75%; background: #8b6fd6" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div></div>
			</div>
			<div class="mb-3">
				<div class="d-flex justify-content-between"><span>Películas</span><span>62%</span></div>
				<div class="progress"><div class="progress-bar" style="width: 62%; background: #f0a070" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"></div></div>
			</div>
			<div class="mb-3">
				<div class="d-flex justify-content-between"><span>Series</span><span>80%</span></div>
				<div class="progress"><div class="progress-bar" style="width: 80%; background: #5fb88a" role="progressbar" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100"></div></div>
			</div>
			<div>
				<div class="d-flex justify-content-between"><span>Juegos</span><span>50%</span></div>
				<div class="progress"><div class="progress-bar" style="width: 50%; background: #6c93e6" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div></div>
			</div>
		</div>
	</div>
</body>
</html>
