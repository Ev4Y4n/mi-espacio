<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mi Espacio</title>

<!-- Tabler (el que realmente usan tus clases: navbar-vertical, row-cards, card-body...) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/base-colors.css}" />
<link rel="stylesheet" th:href="@{/css/dashboard.css}" />

</head>
 
<body>
<div class="page">
	<div th:replace="~{dashboard/nav-bar.html :: nav_bar}"></div>
	<!-- Contenido -->
	<div class="page-wrapper">
		<!-- Banner -->
		<div class="position-relative w-100"
		     th:style="|background: url('@{/img/mi-espacio-fondo.png}') center bottom / cover no-repeat; height: 12rem; image-rendering: pixelated;|">
			<div class="position-absolute top-0 end-0 m-3" style="z-index: 2;">
				<div th:replace="~{profile-dropdown :: profile_dropdown}"></div>
			</div>
		</div>
		<main class="page-body" >
			<div class="container-xl">
				<div class="row row-cards">
					<!-- Saludo + botones de añadir -->
					<div class="col-12">
						<div th:replace="~{dashboard/add-new-card.html :: add-new-card}"></div>
					</div>
					<!-- 4 tarjetas de resumen -->
					<div class="col-6 col-xl-3">
						<div th:replace="~{dashboard/books-card.html :: books-card}"></div>
					</div>
					<div class="col-6 col-xl-3">
						<div th:replace="~{dashboard/movies-card.html :: movies-card}"></div>
					</div>
					<div class="col-6 col-xl-3">
						<div th:replace="~{dashboard/series-card.html :: series-card}"></div>
					</div>
					<div class="col-6 col-xl-3">
						<div th:replace="~{dashboard/videogames-card.html :: videogames-card}"></div>
					</div>
					<!-- Actividad reciente (2/3) -->
					<div class="col-12 col-xl-8">
						<div th:replace="~{dashboard/recent-activity-card.html :: recent-activity-card}"></div>
					</div>
					<!-- Columna derecha (1/3) -->
					<div class="col-12 col-xl-4">
						<div class="row row-cards">
							<!-- Progreso del mes -->
							<div class="col-12">
								<div th:replace="~{dashboard/month-progress-card.html :: month-progress-card}"></div>
							</div>
							<!-- Tarjeta decorativa -->
							<div class="col-12">
								<div th:replace="~{dashboard/message-card.html :: message-card}"></div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</main>
	</div>
</div>

<!-- JS de Tabler (incluye Bootstrap): necesario para el botón del menú -->
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/js/tabler.min.js"></script>
</body>

</html>
