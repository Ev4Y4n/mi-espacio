<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div class="card" th:fragment="add-new-card">
	<div class="card-body">
		<div class="row align-items-center g-3">
			<div class="col-12 col-lg-5">
				<h2 class="mb-1">¡Hola, <span th:text="${usuario?.nombre} ?: 'Eva'">Eva</span>!</h2>
				<div class="text-secondary">¿Qué quieres registrar hoy?</div>
			</div>
			<div class="col-12 col-lg-7">
				<div class="row g-2">
					<div class="col-6 col-md-3"><a th:href="@{/libros/nuevo}" class="btn w-100 bg-libros">Añadir libro</a></div>
					<div class="col-6 col-md-3"><a th:href="@{/peliculas/nueva}" class="btn w-100 bg-peliculas">Añadir película</a></div>
					<div class="col-6 col-md-3"><a th:href="@{/series/nueva}" class="btn w-100 bg-series">Añadir serie</a></div>
					<div class="col-6 col-md-3"><a th:href="@{/juegos/nuevo}" class="btn w-100 bg-juegos">Añadir juego</a></div>
				</div>
			</div>
		</div>
	</div>
</div>

</body>
</html>
